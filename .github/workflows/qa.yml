name: Validate SNU Lab Navigator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snu-lab-validator
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python syntax and release checks
        run: |
          python -m py_compile tools/automated_enrichment_v2.py tools/collector_entry.py tools/roster_sync.py tools/full_refresh_entry.py tools/test_static.py tools/test_automation_features.py
          python tools/test_static.py
          python tools/test_automation_features.py
      - name: JavaScript syntax checks
        run: |
          node --check dist/app.js
          node --check dist/quality-overrides.js
          node --check dist/activity-refinement.js
          node --check dist/showcase-data.js
          node --check dist/favorites-compare.js
          node --check dist/account.js
          node --check dist/account-ai-bridge.js
      - name: Account/security consistency checks
        run: |
          grep -q 'create table public.lab_accounts' supabase/migrations/20260911_id_only_accounts.sql
          grep -q 'create or replace function public.create_lab_account' supabase/migrations/20260911_id_only_accounts.sql
          grep -q 'create or replace function public.login_lab_account' supabase/migrations/20260911_id_only_accounts.sql
          grep -q 'get_lab_favorites' supabase/migrations/20260911_id_only_accounts.sql
          ! grep -qi 'password' dist/account.js
          ! grep -qi 'Gemini API 키' dist/account.js
          grep -q 'lab_accounts' supabase/functions/gemini-proxy/index.ts
          grep -q 'GEMINI_API_KEY' supabase/functions/gemini-proxy/index.ts
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/gemini-proxy/index.ts
          test ! -e supabase/functions/user-secret/index.ts
      - name: Full refresh parser smoke test
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import json
          p = Path('dist/data/units-000.js')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'window\\.RESEARCH_UNITS\\s*=\\s*(.+?)\\s*;\\s*$', text, re.S)
          assert m, 'units-000.js parser smoke test failed'
          units = json.loads(m.group(1))
          assert units and isinstance(units, list)
          assert all('name' in x for x in units)
          print(f'Parsed {len(units)} units from first chunk')
          PY
