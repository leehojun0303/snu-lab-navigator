name: Report targeted discipline collection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snu-lab-report-targeted
  cancel-in-progress: false

jobs:
  collect-report-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Start from latest snapshot
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate targeted collector
        run: python -m py_compile tools/report_targeted_collect.py tools/collector_entry.py tools/automated_enrichment_v2.py
      - name: Collect report samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/report_targeted_collect.py
      - name: Merge targeted results into latest main
        run: |
          git config user.name "snu-lab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add dist/automation-data.js data/automation-state.json data/report-targeted-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collect report discipline samples"
          git fetch origin main
          git rebase origin/main
          git push
