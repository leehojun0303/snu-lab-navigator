name: Start compact-detail collection now

on:
  push:
    branches: [main]
    paths:
      - '.github/start-compact-collection-now'

permissions:
  contents: write

concurrency:
  group: snu-lab-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - uses: actions/checkout@v7
      - name: Start from the latest saved snapshot
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate collector and public UI contracts
        run: |
          python -m py_compile tools/collector_entry.py tools/automated_enrichment_v2.py
          python tools/test_automation_features.py
          python tools/test_static.py
      - name: Synchronize official professor roster union
        env:
          ROSTER_MAX_PAGES: '100000'
        run: python tools/roster_sync.py --max-pages "$ROSTER_MAX_PAGES"
      - name: Begin fresh compact-detail collection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_UNITS: '100000'
          TIME_BUDGET_MINUTES: '285'
          MAX_AI_REQUESTS: '100000'
          BATCH_SIZE: '40'
          PUBLISH_PROGRESS: '1'
          PROGRESS_PUBLISH_EVERY: '80'
        run: >-
          python tools/collector_entry.py
          --max-units "$MAX_UNITS"
          --time-budget-minutes "$TIME_BUDGET_MINUTES"
          --max-ai-requests "$MAX_AI_REQUESTS"
          --batch-size "$BATCH_SIZE"
      - name: Store changed snapshot
        run: |
          if git diff --quiet -- dist/automation-data.js data/automation-state.json dist/data-loader.js dist/data/units-*.js data/roster-sync-state.json data/automation-progress.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "snu-lab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add dist/automation-data.js data/automation-state.json dist/data-loader.js dist/data/units-*.js data/roster-sync-state.json data/automation-progress.json
          git commit -m "Start compact-detail collection snapshot"
          git fetch origin main
          git rebase origin/main
          git push
