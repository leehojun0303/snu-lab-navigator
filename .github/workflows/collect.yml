name: Refresh official SNU lab data

on:
  push:
    branches: [main]
    paths:
      - 'tools/automated_enrichment.py'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      max_units:
        description: Number of professor-affiliation units to inspect
        required: false
        default: '80'

permissions:
  contents: write

concurrency:
  group: snu-lab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Incremental official-source scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_UNITS: ${{ github.event_name == 'push' && '12' || inputs.max_units || '80' }}
        run: python tools/automated_enrichment.py --max-units "$MAX_UNITS"
      - name: Store changed snapshot
        run: |
          if git diff --quiet -- dist/automation-data.js data/automation-state.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "snu-lab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add dist/automation-data.js data/automation-state.json
          git commit -m "Update official-source research snapshot"
          git fetch origin main
          git rebase origin/main
          git push
