name: Refresh official SNU lab data

on:
  schedule:
    # Production refresh: once daily at 02:00 KST (17:00 UTC).
    - cron: '0 17 * * *'
    # Bootstrap continuation: while the first full pass is unfinished, keep a
    # continuation queued. After bootstrap completes these runs exit immediately.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      max_units:
        description: Number of professor-affiliation units to inspect
        required: false
        default: '100000'
      time_budget_minutes:
        description: Maximum collection time in minutes (0 disables the clock)
        required: false
        default: '350'
      max_ai_requests:
        description: Maximum changed-page Gemini summaries in this run
        required: false
        default: '100000'
      roster_max_pages:
        description: Maximum official roster directory pages to inspect
        required: false
        default: '100000'

permissions:
  contents: write

concurrency:
  group: snu-lab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Start from the latest saved snapshot
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Decide collection mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state_path = Path('data/automation-state.json')
          try:
              state = json.loads(state_path.read_text(encoding='utf-8'))
          except Exception:
              state = {}
          complete = bool(state.get('initial_collection_complete'))
          event = os.environ.get('EVENT_NAME', '')
          schedule = os.environ.get('EVENT_SCHEDULE', '')
          daily = event == 'schedule' and schedule == '0 17 * * *'
          manual = event == 'workflow_dispatch'
          bootstrap = event == 'schedule' and schedule == '30 * * * *'
          should_run = manual or daily or (bootstrap and not complete)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'should_run={str(should_run).lower()}\n')
              f.write(f'bootstrap_complete={str(complete).lower()}\n')
          print({'should_run': should_run, 'initial_collection_complete': complete, 'schedule': schedule})
          PY

      - name: Validate collector and public UI contracts
        if: steps.mode.outputs.should_run == 'true'
        run: |
          python -m py_compile tools/collector_entry.py tools/collector_runner.py tools/automated_enrichment_v2.py
          python tools/test_automation_features.py
          python tools/test_static.py

      - name: Synchronize official professor roster union
        if: steps.mode.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * *')
        env:
          ROSTER_MAX_PAGES: ${{ github.event_name == 'schedule' && '100000' || inputs.roster_max_pages || '100000' }}
        run: python tools/roster_sync.py --max-pages "$ROSTER_MAX_PAGES"

      - name: Remember starting cursor
        if: steps.mode.outputs.should_run == 'true' && steps.mode.outputs.bootstrap_complete != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          try:
              state=json.loads(Path('data/automation-state.json').read_text(encoding='utf-8'))
          except Exception:
              state={}
          Path('/tmp/snu_lab_start_cursor').write_text(str(int(state.get('cursor',0))), encoding='utf-8')
          PY

      - name: Incremental official-source scan
        if: steps.mode.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_UNITS: ${{ github.event_name == 'schedule' && '100000' || inputs.max_units || '100000' }}
          TIME_BUDGET_MINUTES: ${{ github.event_name == 'schedule' && '350' || inputs.time_budget_minutes || '350' }}
          MAX_AI_REQUESTS: ${{ github.event_name == 'schedule' && '100000' || inputs.max_ai_requests || '100000' }}
          BATCH_SIZE: '5'
          PUBLISH_PROGRESS: '1'
          PROGRESS_PUBLISH_EVERY: '5'
        run: >-
          python tools/collector_runner.py
          --max-units "$MAX_UNITS"
          --time-budget-minutes "$TIME_BUDGET_MINUTES"
          --max-ai-requests "$MAX_AI_REQUESTS"
          --batch-size "$BATCH_SIZE"

      - name: Mark initial full pass complete
        if: steps.mode.outputs.should_run == 'true' && steps.mode.outputs.bootstrap_complete != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state_path=Path('data/automation-state.json')
          progress_path=Path('data/automation-progress.json')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          progress=json.loads(progress_path.read_text(encoding='utf-8')) if progress_path.exists() else {}
          start=int(Path('/tmp/snu_lab_start_cursor').read_text(encoding='utf-8'))
          end=int(state.get('cursor',0))
          checked=int(progress.get('checked',0))
          total=int(progress.get('total',0))
          # A cursor wrap means every position in the initial roster has now been
          # reached at least once. checked>=total covers an exact full-pass run.
          completed=(checked >= total > 0) or (checked > 0 and end <= start and start != 0)
          if completed:
              state['initial_collection_complete']=True
              state['initial_collection_completed_at']=progress.get('updated_at','')
              progress['initial_collection_complete']=True
              state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              progress_path.write_text(json.dumps(progress,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('Initial full pass completed; future non-daily bootstrap runs will skip.')
          else:
              print(f'Initial pass continues: cursor {start} -> {end}, checked_this_run={checked}, total={total}')
          PY

      - name: Store changed snapshot
        if: steps.mode.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- dist/automation-data.js data/automation-state.json dist/data-loader.js dist/data/units-*.js data/roster-sync-state.json data/automation-progress.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "snu-lab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add dist/automation-data.js data/automation-state.json dist/data-loader.js dist/data/units-*.js data/roster-sync-state.json data/automation-progress.json
          git commit -m "Update official roster and research snapshot"
          git fetch origin main
          git rebase origin/main
          git push
