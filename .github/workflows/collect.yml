name: Refresh official SNU lab data

on:
  push:
    branches: [main]
    paths:
      - 'tools/automated_enrichment.py'
      - '.github/workflows/collect.yml'
  schedule:
    # 03:00 KST. The collector stops cleanly by 07:45 KST.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      max_units:
        description: Number of professor-affiliation units to inspect
        required: false
        default: '100000'
      time_budget_minutes:
        description: Maximum collection time in minutes (0 disables the clock)
        required: false
        default: '285'
      max_ai_requests:
        description: Maximum changed-page Gemini summaries in this run
        required: false
        default: '400'

permissions:
  contents: write

concurrency:
  group: snu-lab-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Incremental official-source scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_UNITS: ${{ github.event_name == 'schedule' && '100000' || github.event_name == 'push' && '12' || inputs.max_units || '100000' }}
          TIME_BUDGET_MINUTES: ${{ github.event_name == 'schedule' && '285' || github.event_name == 'push' && '0' || inputs.time_budget_minutes || '285' }}
          MAX_AI_REQUESTS: ${{ github.event_name == 'schedule' && '400' || github.event_name == 'push' && '12' || inputs.max_ai_requests || '400' }}
          BATCH_SIZE: ${{ github.event_name == 'push' && '12' || '40' }}
        run: >-
          python tools/automated_enrichment.py
          --max-units "$MAX_UNITS"
          --time-budget-minutes "$TIME_BUDGET_MINUTES"
          --max-ai-requests "$MAX_AI_REQUESTS"
          --batch-size "$BATCH_SIZE"
      - name: Store changed snapshot
        run: |
          if git diff --quiet -- dist/automation-data.js data/automation-state.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "snu-lab-automation"
          git config user.email "actions@users.noreply.github.com"
          git add dist/automation-data.js data/automation-state.json
          git commit -m "Update official-source research snapshot"
          git fetch origin main
          git rebase origin/main
          git push
